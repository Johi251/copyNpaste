<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101214"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Kachel -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <rect x="10" y="10" width="1004" height="1004" rx="222" fill="none" stroke="#1d2b2a" stroke-width="8"/>

  <!-- Magazin-Stapel: oben kürzester, hellster Balken = Paste-Spitze -->
  <rect x="336" y="270" width="352" height="98" rx="36" fill="url(#topBar)"/>
  <rect x="254" y="463" width="516" height="98" rx="36" fill="#0f766e"/>
  <rect x="172" y="656" width="680" height="98" rx="36" fill="#134e4a"/>

  <!-- Erfolgs-Haken: kopiert & über die Bridge bestätigt -->
  <path d="M768 244 l42 42 l80 -88" stroke="#5eead4" stroke-width="44" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
