name: Build copyNpaste

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles nsis"
            artifact: windows-x64
          - os: macos-15-intel
            args: "--bundles app,dmg"
            artifact: macos-intel
          - os: macos-latest
            args: "--bundles app,dmg"
            artifact: macos-apple-silicon
          - os: ubuntu-22.04
            args: "--bundles deb"
            artifact: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Systemabhängigkeiten (nur Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust-Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Dependencies
        run: bun install --frozen-lockfile

      - name: Frontend checks
        run: |
          npm run check
          npm test

      - name: Rust tests
        if: runner.os != 'Linux'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: copyNpaste-${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/copynpaste.exe
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: copyNpaste-complete
          path: dist-delivery/*
          if-no-files-found: error
